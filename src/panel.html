<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f4fd">
<title>Hoshi — your next good conversation</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="app">
<header class="app-header">
 <div class="wordmark"><div class="star-logo" aria-hidden="true">✦</div><div><strong>hoshi<span class="period">.</span></strong><small>your career, in orbit</small></div></div>
 <button class="icon-btn" id="settings-trigger" aria-label="Career search settings" title="Settings">⚙</button>
</header>
<main id="view" aria-live="polite"><div class="loading">Opening your orbit…</div></main>
<nav class="bottom-nav" aria-label="Main navigation">
 <button data-tab="orbit" class="active"><span>✦</span>Orbit</button>
 <button data-tab="jobs"><span>▦</span>Jobs</button>
 <button data-tab="people"><span>♧</span>People</button>
 <button data-tab="activity"><span>◉</span>Activity</button>
</nav>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="./panel.js"></script>
</body>
</html>
